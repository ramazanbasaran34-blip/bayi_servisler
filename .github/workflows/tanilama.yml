name: Sayfa tanılama

# Markaların gerçek sayfalarını indirip yapı raporunu depoya yazar.
# Amaç: ayrıştırıcıyı tahminle değil, sayfanın gerçek yapısını görerek yazmak.

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: "Boşluklarla ayrılmış marka adları (boş = hepsi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tanila:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Sayfaları incele
        run: python tanila.py ${{ github.event.inputs.markalar }}
        continue-on-error: true
      - name: Raporu depoya yaz
        run: |
          git config user.name  "bayi-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f tanilama/
          git diff --staged --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "Tanılama raporu: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || git rebase --skip
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
