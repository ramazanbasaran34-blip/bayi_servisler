name: Ajax dinle (tarayıcı)

on:
  workflow_dispatch:
    inputs:
      hedefler:
        description: "Boşlukla ayrılmış hedefler (boş = hepsi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dinle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Bağımlılık
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Dinle
        run: python ajax_dinle.py ${{ inputs.hedefler }}
      - name: Depoya işle
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ham/ || true
          git diff --staged --quiet || git commit -m "ajax dinleme"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
