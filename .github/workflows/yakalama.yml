name: Sayfa yakalama

# Markaların sayfalarını bir kez indirip depoya kaydeder.
# Amaç: ayrıştırıcıyı tarama yapmadan, kaydedilmiş sayfalar üzerinde
# geliştirebilmek. Sitelere tekrar tekrar gidilmesini önler.

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: "VİRGÜLLE ayrılmış marka adları (boş = hepsi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  yakala:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Sayfaları yakala
        run: |
          mkdir -p yakalanan
          printf '%s' "${{ github.event.inputs.markalar }}" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > /tmp/m.txt || true
          cat /tmp/m.txt
          if [ -s /tmp/m.txt ]; then
            xargs -a /tmp/m.txt -d '\n' python -u yakala.py 2>&1 | tee yakalanan/kayit.txt
          else
            python -u yakala.py 2>&1 | tee yakalanan/kayit.txt
          fi
        continue-on-error: true
      - name: Raporu depoya yaz
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Git yerine doğrudan API. Önceki denemelerde "git push" sessizce
          # reddediliyor, döngü hatayı yutuyor ve adım yeşil görünüyordu.
          # API çağrısının HTTP kodu net: başarısızsa iş akışı kırmızı olur.
          set -e
          ls -la yakalanan/
          python - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error, tarfile, io
          from pathlib import Path

          tok = os.environ["GH_TOKEN"]
          depo = os.environ["GITHUB_REPOSITORY"]
          API = f"https://api.github.com/repos/{depo}"
          H = {"Authorization": f"Bearer {tok}",
               "Accept": "application/vnd.github+json",
               "User-Agent": "kesif"}

          # Tüm raporu tek arşivde topla — çok sayıda küçük dosya yerine
          # tek istek, tek hata noktası.
          tampon = io.BytesIO()
          with tarfile.open(fileobj=tampon, mode="w:gz") as t:
              for f in sorted(Path("kesif").iterdir()):
                  if f.is_file():
                      t.add(f, arcname=f.name)
          icerik = base64.b64encode(tampon.getvalue()).decode()
          yol = "yakalanan/sayfalar.tar.gz"

          sha = None
          try:
              q = urllib.request.Request(f"{API}/contents/{yol}", headers=H)
              with urllib.request.urlopen(q, timeout=60) as x:
                  sha = json.loads(x.read()).get("sha")
          except urllib.error.HTTPError:
              pass

          govde = {"message": "Yakalanan sayfalar", "content": icerik,
                   "branch": os.environ.get("GITHUB_REF_NAME", "main")}
          if sha:
              govde["sha"] = sha
          q = urllib.request.Request(f"{API}/contents/{yol}", method="PUT",
                                     data=json.dumps(govde).encode(), headers=H)
          try:
              with urllib.request.urlopen(q, timeout=120) as x:
                  print("Rapor yazıldı:", x.status, len(icerik), "bayt")
          except urllib.error.HTTPError as e:
              print("HATA", e.code, e.read().decode()[:400])
              raise SystemExit(1)
          PYEOF
