name: MJ tarama (Kuba, RKS)

# Elle başlatılır. Kuba ve RKS'i ajax.php üzerinden tarar,
# sonucu bayiler.db'ye işler ve depoya kaydeder.

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: "Kuba, RKS ya da boş (ikisi)"
        required: false
        default: ""
      kuru:
        description: "Veritabanına yazmadan sadece rapor (evet/hayır)"
        required: false
        default: "hayır"

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılık
        run: pip install -r requirements.txt

      - name: Gerileme testi
        run: python test_ayristirici.py

      - name: Tara
        run: |
          EK=""
          if [ "${{ inputs.kuru }}" = "evet" ]; then EK="--kuru"; fi
          python mj_tara.py ${{ inputs.markalar }} $EK

      - name: Denetim
        if: inputs.kuru != 'evet'
        run: python denetle.py --marka Kuba || true

      - name: Depoya işle
        if: inputs.kuru != 'evet'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bayiler.db ham/
          git diff --staged --quiet || git commit -m "MJ tarama: Kuba ve RKS"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
          exit 1
