name: BMW ve Korlas yakala (tarayıcı)

# BMW düz isteğe yanıt vermiyor (120sn timeout), Korlas Cloudflare ara
# sayfası veriyor. Gerçek Chrome'u sanal ekranda çalıştırıyoruz.
# Tarama YAPMAZ, veritabanına dokunmaz.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yakala:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılık
        run: |
          pip install playwright
          playwright install --with-deps chrome || playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Yakala
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" python bmw_korlas_yakala.py
      - name: Depoya işle
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ham/ || true
          git diff --staged --quiet || git commit -m "BMW/Korlas tarayıcı yakalama"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
          exit 1
