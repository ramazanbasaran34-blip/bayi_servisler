name: Marka keşfi

# Bir markanın bayi sayfasını inceler, seçici taslağı üretir.
# Actions > Marka keşfi > Run workflow ile çalıştırılır, 1-2 dakika sürer.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bayi sayfasının tam adresi"
        required: true
        default: "https://motolux.com.tr/bayiler/sehir/aksaray/"
      encoding:
        description: "Türkçe karakterler bozuk çıkarsa: windows-1254"
        required: false
        default: ""
      browser:
        description: "Liste JS ile çiziliyorsa evet yaz"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kesfet:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarayıcı kur
        if: ${{ github.event.inputs.browser != '' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sayfayı incele
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.encoding }}" ]; then
            ARGS="$ARGS --encoding ${{ github.event.inputs.encoding }}"
          fi
          if [ -n "${{ github.event.inputs.browser }}" ]; then
            ARGS="$ARGS --browser"
          fi
          python kesfet.py "${{ github.event.inputs.url }}" $ARGS

      - name: Ham HTML'i sakla
        uses: actions/upload-artifact@v4
        with:
          name: kesif-sonucu
          path: kesif/
          retention-days: 7
