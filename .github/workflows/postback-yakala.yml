name: Postback yakala (Altai)

on:
  workflow_dispatch:
    inputs:
      moduller:
        description: "Modül adları (boş = altai)"
        required: false
        default: "altai"
      hepsi:
        description: "Tüm iller mi? (evet/hayır)"
        required: false
        default: "hayır"

permissions:
  contents: write

jobs:
  yakala:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Bağımlılık
        run: pip install -r requirements.txt
      - name: Yakala
        run: |
          EK=""
          if [ "${{ inputs.hepsi }}" = "evet" ]; then EK="--hepsi"; fi
          python postback_yakala.py ${{ inputs.moduller }} $EK
      - name: Depoya işle
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ham/ || true
          git diff --staged --quiet || git commit -m "postback yakalama"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
