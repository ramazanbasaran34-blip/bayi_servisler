name: Derin keşif

# Boş kalan markaların sayfalarını bir insan gibi kullanır: il seçer, arama
# yapar ve HER ADIMDA sayfanın arkada çağırdığı adresleri kaydeder.
# Amaç tarayıcıyla kazımak değil, verinin geldiği adresi bulmak.

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: "Boşlukla ayrılmış marka adları (boş = hepsi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Sayfaları incele
        run: python kesif2.py ${{ github.event.inputs.markalar }}
        continue-on-error: true
      - name: Raporu depoya yaz
        run: |
          git config user.name  "bayi-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f kesif/
          git diff --staged --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "Derin keşif: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || git rebase --skip
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
