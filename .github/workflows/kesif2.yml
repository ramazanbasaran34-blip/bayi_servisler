name: Derin keşif

# Boş kalan markaların sayfalarını bir insan gibi kullanır: il seçer, arama
# yapar ve her adımda sayfanın arkada çağırdığı adresleri kaydeder.

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: "VİRGÜLLE ayrılmış marka adları (boş = hepsi). Örn: Kuba,Meka Motor,Yamaha"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Sayfaları incele
        # Hata olursa da kaydı görebilmek için çıktı dosyaya yazılıyor.
        # Önceki denemede betik sessizce çöktü ve sebebini göremedim.
        run: |
          mkdir -p kesif
          # Virgülle ayır: boşluklu marka adları ("Meka Motor") bozulmasın.
          # Önceki denemede tırnaklı adlar kabuk komutunu bozup betiği
          # sessizce çökertmişti.
          printf '%s' "${{ github.event.inputs.markalar }}" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' > kesif/istenen.txt || true
          echo "İstenen markalar:"; cat kesif/istenen.txt || true
          set -o pipefail
          if [ -s kesif/istenen.txt ]; then
            xargs -a kesif/istenen.txt -d '\n' python -u kesif2.py 2>&1 \
              | tee kesif/kayit.txt
          else
            python -u kesif2.py 2>&1 | tee kesif/kayit.txt
          fi
        continue-on-error: true

      - name: Raporu depoya yaz
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Git yerine doğrudan API. Önceki denemelerde "git push" sessizce
          # reddediliyor, döngü hatayı yutuyor ve adım yeşil görünüyordu.
          # API çağrısının HTTP kodu net: başarısızsa iş akışı kırmızı olur.
          set -e
          ls -la kesif/
          python - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error, tarfile, io
          from pathlib import Path

          tok = os.environ["GH_TOKEN"]
          depo = os.environ["GITHUB_REPOSITORY"]
          API = f"https://api.github.com/repos/{depo}"
          H = {"Authorization": f"Bearer {tok}",
               "Accept": "application/vnd.github+json",
               "User-Agent": "kesif"}

          # Tüm raporu tek arşivde topla — çok sayıda küçük dosya yerine
          # tek istek, tek hata noktası.
          tampon = io.BytesIO()
          with tarfile.open(fileobj=tampon, mode="w:gz") as t:
              for f in sorted(Path("kesif").iterdir()):
                  if f.is_file():
                      t.add(f, arcname=f.name)
          icerik = base64.b64encode(tampon.getvalue()).decode()
          yol = "kesif/rapor.tar.gz"

          sha = None
          try:
              q = urllib.request.Request(f"{API}/contents/{yol}", headers=H)
              with urllib.request.urlopen(q, timeout=60) as x:
                  sha = json.loads(x.read()).get("sha")
          except urllib.error.HTTPError:
              pass

          govde = {"message": "Derin keşif raporu", "content": icerik,
                   "branch": os.environ.get("GITHUB_REF_NAME", "main")}
          if sha:
              govde["sha"] = sha
          q = urllib.request.Request(f"{API}/contents/{yol}", method="PUT",
                                     data=json.dumps(govde).encode(), headers=H)
          try:
              with urllib.request.urlopen(q, timeout=120) as x:
                  print("Rapor yazıldı:", x.status, len(icerik), "bayt")
          except urllib.error.HTTPError as e:
              print("HATA", e.code, e.read().decode()[:400])
              raise SystemExit(1)
          PYEOF
