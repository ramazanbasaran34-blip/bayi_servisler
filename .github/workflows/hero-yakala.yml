name: Hero yakala (tarayıcı)

# Hero'nun sayfası Cloudflare doğrulaması istiyor.
# Paketlenmiş Chromium headless olarak tanınıp engelleniyor; bu yüzden
# GERÇEK Chrome'u sanal ekranda (xvfb) GÖRÜNÜR kipte çalıştırıyoruz.
# Tarama YAPMAZ, veritabanına dokunmaz.

on:
  workflow_dispatch:
    inputs:
      hepsi:
        description: "Tüm iller mi? (evet/hayır — hayır = birkaç örnek il)"
        required: false
        default: "hayır"

permissions:
  contents: write

jobs:
  yakala:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılık
        run: |
          pip install playwright
          playwright install --with-deps chrome || playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Yakala (sanal ekranda)
        run: |
          EK=""
          if [ "${{ inputs.hepsi }}" = "evet" ]; then EK="--hepsi"; fi
          xvfb-run -a --server-args="-screen 0 1366x768x24" python hero_yakala.py $EK

      - name: Depoya işle
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ham/ || true
          git diff --staged --quiet || git commit -m "Hero tarayıcı yakalama"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
          exit 1
