name: Bayileri tara ve siteyi yayınla

# Markalar gruplara bölünüp AYNI ANDA taranır. Tek sırada tarama 6 saatlik
# sınıra dayanıyordu; 10 grup paralel çalışınca her grup ~1 saatte bitiyor.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      markalar:
        description: "Sadece belirli markalar (boş = periyodu dolanlar)"
        required: false
        default: ""
      hepsi:
        description: "Periyodu beklemeden hepsini tara (evet yaz)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bayi-tarama
  cancel-in-progress: false

jobs:
  hazirlik:
    runs-on: ubuntu-latest
    outputs:
      gruplar: ${{ steps.bol.outputs.gruplar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install PyYAML
      - id: bol
        run: echo "gruplar=$(python gruplar.py 10)" >> $GITHUB_OUTPUT

  tara:
    needs: hazirlik
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        grup: ${{ fromJson(needs.hazirlik.outputs.gruplar) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Grubu tara
        run: |
          mkdir -p parcalar
          AD=$(echo "${{ matrix.grup }}" | md5sum | cut -c1-8)
          if [ -n "${{ github.event.inputs.markalar }}" ]; then
            python cli.py --db "parcalar/$AD.db" tara --marka ${{ github.event.inputs.markalar }}
          elif [ -n "${{ github.event.inputs.hepsi }}" ]; then
            python cli.py --db "parcalar/$AD.db" tara --marka ${{ matrix.grup }}
          else
            python cli.py --db "parcalar/$AD.db" tara --zamanlanmis --marka ${{ matrix.grup }}
          fi
        continue-on-error: true
      - name: Parçayı sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parca-${{ strategy.job-index }}
          path: parcalar/
          retention-days: 3

  birlestir:
    needs: tara
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Parçaları indir
        uses: actions/download-artifact@v4
        with:
          pattern: parca-*
          path: indirilen
          merge-multiple: true
      - name: Birleştir
        run: |
          mkdir -p parcalar
          find indirilen -name "*.db" -exec cp {} parcalar/ \; || true
          ls -la parcalar/ || true
          python birlestir.py parcalar bayiler.db
      - name: Durum özeti
        run: python cli.py durum || true
      - name: Denetim
        run: python denetle.py || true
      - name: Siteyi üret
        run: |
          mkdir -p site
          python uret_index.py site/index.html
      - name: Veritabanını depoya yaz
        run: |
          git config user.name  "bayi-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f bayiler.db
          git diff --staged --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "Veri güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || git rebase --skip
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Veri kaydedilemedi"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  yayinla:
    needs: birlestir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
