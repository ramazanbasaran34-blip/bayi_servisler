name: Bayileri tara ve siteyi yayınla

# NE ZAMAN ÇALIŞIR
on:
  schedule:
    # Her gece Türkiye saatiyle 03:00 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:      # "Run workflow" butonuyla elle de başlatılabilir
    inputs:
      markalar:
        description: "Sadece belirli markalar (boş = periyodu dolanlar)"
        required: false
        default: ""

# Sayfayı yayınlamak ve veritabanını geri yazmak için gerekli izinler
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bayi-tarama
  cancel-in-progress: false     # yarım kalan taramayı iptal etme

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # GitHub'ın iş başına üst sınırı 6 saat
    # Not: il seçici keşfi devreye girdikten sonra birçok marka 81 sayfa
    # geziyor (satış + servis için ayrı ayrı). Süre bu yüzden uzadı.

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarayıcı kur (browser modundaki markalar için)
        run: |
          pip install playwright
          playwright install --with-deps chromium
        continue-on-error: true   # kurulamazsa html/json markaları yine çalışsın

      - name: Markaları tara
        run: |
          if [ -n "${{ github.event.inputs.markalar }}" ]; then
            python cli.py tara --marka ${{ github.event.inputs.markalar }}
          else
            python cli.py tara --zamanlanmis
          fi
        continue-on-error: true   # bir marka patlarsa iş akışı durmasın

      - name: Durum özeti
        run: python cli.py durum

      - name: Siteyi üret
        run: |
          mkdir -p site
          python uret_index.py site/index.html
          python cli.py rapor || true
          cp -f ciktilar/BAYI-LISTESI.xlsx site/ 2>/dev/null || true

      - name: Veritabanını depoya geri yaz
        # Toplanan veri kaybolmasın: her tarama sonrası commit edilir.
        #
        # ÖNEMLİ: tarama saatler sürüyor ve bu sürede depoya kod yüklenmiş
        # olabilir. O durumda düz "git push" reddedilir ve tüm taramanın
        # sonucu sessizce kaybolur (bir kez başımıza geldi). Bu yüzden önce
        # uzaktaki değişiklikleri alıp üzerine biniyoruz, sonra deniyoruz.
        run: |
          git config user.name  "bayi-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f bayiler.db
          git diff --staged --quiet && { echo "Veride değişiklik yok."; exit 0; }
          git commit -m "Veri güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for deneme in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            # Veritabanı ikili dosya: çakışmada bizimki (yeni tarama) kazanır
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || {
              git checkout --ours bayiler.db && git add bayiler.db && git rebase --continue
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Veri kaydedildi (deneme $deneme)."
              exit 0
            fi
            echo "Push reddedildi, tekrar deneniyor..."
            sleep 5
          done
          echo "::error::Veritabanı kaydedilemedi — tarama sonucu kayıp!"
          exit 1

      - name: Sayfayı hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veritabanını yedek olarak sakla
        # Kaydetme yine de başarısız olursa veri buradan kurtarılabilir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayiler-db
          path: bayiler.db
          retention-days: 14

  yayinla:
    needs: tara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: yayin
        uses: actions/deploy-pages@v4
