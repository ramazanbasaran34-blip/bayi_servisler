name: Özel toplayıcılarla tara

# ozel/ altındaki marka bazlı toplayıcıları çalıştırır.
# Kuba, RKS, Mondial gibi yakın zamanda taranmış markalara DOKUNMAZ.

on:
  workflow_dispatch:
    inputs:
      moduller:
        description: "Boşlukla ayrılmış modül adları (boş = hepsi)"
        required: false
        default: ""
      kuru:
        description: "Veritabanına yazmadan sadece rapor (evet/hayır)"
        required: false
        default: "hayır"

permissions:
  contents: write

concurrency:
  group: bayiradar-db
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılık
        run: pip install -r requirements.txt
      - name: Gerileme testi
        run: python test_ayristirici.py
      - name: Kaydedilmiş sayfalarla ön test
        run: python ozel_test.py || true
      - name: Tara
        run: |
          EK=""
          if [ "${{ inputs.kuru }}" = "evet" ]; then EK="--kuru"; fi
          python ozel_tara.py ${{ inputs.moduller }} $EK
      - name: Depoya işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ham/ bayiler.db
          git diff --staged --quiet || git commit -m "özel toplayıcı taraması"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 20
          done
          exit 1
