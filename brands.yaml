# ============================================================================
#  BAYİ RADAR — 63 Motosiklet Markası
#  Kaynak: markalar_ve_web_siteleri.xlsx
# ----------------------------------------------------------------------------
#  ÇALIŞMA MANTIĞI
#  Hiçbir markada CSS seçici yazılı DEĞİL. Sistem sayfadaki tekrar eden yapıyı
#  kendisi buluyor (bayiradar/otomatik.py): telefon ve adres içeren, kardeşleri
#  aynı sınıfa sahip kapları arıyor, en yüksek puanlıyı seçiyor.
#
#  Bir markada tutmazsa (0 kayıt) sistem onu 'hatali' işaretler ve eski verisini
#  korur. O zaman o markaya elle 'row' + 'fields' yazılır; yazıldığı anda
#  otomatik mod devre dışı kalır ve el yazması tarif kullanılır.
#
#  ALANLAR
#    url          bayi sayfası; {il_slug} varsa 81 il tek tek gezilir
#    iterate      il_slug | il_kodlari | sayfa
#    mode         html (varsayılan) | json | browser
#    encoding     Türkçe karakter bozuksa windows-1254
#    bekleme      bu siteye istekler arası saniye
#    periyot_saat kaç saatte bir taransın (varsayılan 24)
#    row/fields   sadece otomatik mod tutmazsa doldurulur
# ============================================================================

ayarlar:
  bekleme: 1.5
  marka_arasi_saniye: 120
  cache_saat: 6

