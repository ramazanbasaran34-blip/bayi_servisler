# ============================================================================
#  BAYİ RADAR — 63 Motosiklet Markası
#  Kaynak dosya: markalar_ve_web_siteleri.xlsx
#  Üretim: 27.08.2026
# ----------------------------------------------------------------------------
#  63 marka var ama 59 farklı kaynak sayfa: bazı markalar aynı distribütörün
#  bayi sayfasını paylaşıyor (Bajaj+Kanuni, Peugeot+Horwin+Lambretta,
#  Ducati+Triumph). O sayfaların tarifi bir kez yazılır, birden çok markayı besler.
#
#  DURUM
#    dogrulandi: "..."  → sayfa gerçekten açıldı ve seçiciler test edildi
#    pasif: true        → URL doğru, tarif henüz yazılmadı
#
#  BİR MARKAYI DEVREYE ALMAK
#    1. Bayi sayfasını aç, F12 → Network → XHR sekmesi
#         Bayileri içeren JSON isteği var mı?  → mode: json   (en sağlamı)
#         Ctrl+U kaynağında bayi adları var mı? → mode: html
#         İkisi de yok (JS çiziyor)             → mode: browser
#    2. Seçicileri yaz
#    3. python cli.py test --marka "Marka Adı"
#    4. Doğru çıkınca 'pasif: true' satırını sil
# ============================================================================

ayarlar:
  bekleme: 1.5
  marka_arasi_saniye: 180
  cache_saat: 6

