# ============================================================================
#  BAYİ RADAR — 62 Motosiklet Markası · Satış ve Servis
#  Kaynak: markalar_ve_web_siteleri_bayiler_ve_servisler_linkleri_28_08_2026.xlsx
# ----------------------------------------------------------------------------
#  ROL MANTIĞI
#    Her markanın bir ya da iki kaynağı var:
#      satis_servis → bayi ve servis linki AYNI. Site ikisini birlikte veriyor,
#                     kayıtlar doğrudan "Satış + Servis" sayılıyor. (25 marka)
#      satis + servis → linkler AYRI, ikisi ayrı taranıyor. (37 marka)
#
#    Ayrı taranan markalarda aynı firma iki listede de çıkabilir. Sistem bunu
#    telefon, ad çekirdeği ve adres benzerliğiyle tanıyıp TEK kayda birleştirir
#    ve rolünü "Satış + Servis" yapar. (bayiradar/eslestir.py)
#
#  BEKLENEN SAYI
#    Bazı markalarda saha bilgisinden beklenen kayıt aralığı yazılı. Denetim
#    aracı gelen sayıyı bununla karşılaştırıyor. Amaç, "kayıtlar temiz görünüyor
#    ama listenin yarısı hiç gelmemiş" durumunu yakalamak — Mondial'de tam bu
#    oldu: 390 tertemiz kayıt vardı, 600 servisin hiçbiri yoktu.
#
#    Aralık kaynak yapısına göre hesaplandı. Bayi ve servis AYNI sayfadaysa
#    kayıtlar zaten birleşik geliyor, beklenen ~büyük olan sayı kadar. AYRI
#    sayfadaysa aynı firma iki listede çıkabilir; sistem birleştirse de sonuç
#    "büyük olan" ile "toplam" arasında bir yerde oluyor.
#
#  TARİF GEREKMİYOR
#    CSS seçici yazılı değil; yapı sayfadan otomatik çözülüyor.
#    Tutmazsa marka 'hatali' işaretlenir, eski verisi korunur.
# ============================================================================

ayarlar:
  bekleme: 1.5
  marka_arasi_saniye: 45
  cache_saat: 6
  periyot_saat: 168

markalar:

  #  1. HONDA  ·  Japonya  ·  www.honda.com.tr
  "Honda":
    # Sitede satış ve servis ayrı listelenmiyor; her nokta ikisini de
    # yapıyor. Kayıtlar "Satış + Servis" olarak işaretleniyor.
    beklenen: [36, 78]   # saha: ~52 bayi, ~52 servis
    mode: browser
    kaynaklar:
      - rol: satis_servis
        url: "https://www.honda.com.tr/motosiklet/bayiler-ve-servisler"

  #  2. YAMAHA  ·  Japonya  ·  www.yamaha-motor.eu
  "Yamaha":
    beklenen: [27, 125]   # saha: 45 satış, 45 servis
    # Sitede satış ve servis ayrı listelenmiyor; her nokta ikisini de
    # yapıyor. Kayıtlar "Satış + Servis" olarak işaretleniyor.
    mode: browser
    kaynaklar:
      - rol: satis_servis
        url: "https://www.yamaha-motor.eu/tr/tr/dealer-locator/"

  #  3. BAJAJ  ·  Hindistan  ·  www.ekuralkan.com
  "Bajaj":
    beklenen: [200, 320]   # Kuralkan: 98 satış + 177 servis (kesin)
    # ozel/kuralkan.py ile toplanıyor: liste Next.js flight
    # verisinde gömülü, ?city parametresi sunucuda işlenmiyor.
    ozel: kuralkan
    bekleme: 1.5
    kaynaklar:
      - rol: satis
        url: "https://www.ekuralkan.com/motosiklet-satis-noktalari?city={sayi}"
        iterate: {bitis: 81, type: sayi}
      - rol: servis
        url: "https://www.ekuralkan.com/motosiklet-teslimat-noktalari?city={sayi}"
        iterate: {bitis: 81, type: sayi}

  #  4. KANUNI  ·  Türkiye-Çin  ·  www.ekuralkan.com
  "Kanuni":
    beklenen: [200, 320]   # Kuralkan: 98 satış + 177 servis (kesin)
    # ozel/kuralkan.py ile toplanıyor: liste Next.js flight
    # verisinde gömülü, ?city parametresi sunucuda işlenmiyor.
    ozel: kuralkan
    bekleme: 1.5
    kaynaklar:
      - rol: satis
        url: "https://www.ekuralkan.com/motosiklet-satis-noktalari?city={sayi}"
        iterate: {bitis: 81, type: sayi}
      - rol: servis
        url: "https://www.ekuralkan.com/motosiklet-teslimat-noktalari?city={sayi}"
        iterate: {bitis: 81, type: sayi}

  #  5. MONDIAL  ·  Türkiye-Çin  ·  www.mondialmotor.com.tr
  "Mondial":
    beklenen: [420, 1200]   # saha: ~400 bayi, ~600 servis
    encoding: windows-1254
    bekleme: 2.0
    kaynaklar:
      - rol: satis
        url: "https://www.mondialmotor.com.tr/bayilerimiz?sehir={il_slug}"
        iterate: il_slug
        il_url_den: true
      - rol: servis
        url: "https://www.mondialmotor.com.tr/servis-noktalari?sehir={il_slug}"
        iterate: il_slug
        il_url_den: true

  #  6. CFMOTO  ·  Çin  ·  www.cfmoto.com.tr
  "CFMoto":
    # Tablo yapısı 30.08.2026'da doğrulandı: 29 kayıt, il/ilçe/telefon tam.
    # Mondial ile aynı altyapı (?sehir= parametresi).
    encoding: windows-1254
    beklenen: [350, 1200]
    bekleme: 2.0
    kaynaklar:
      - rol: satis
        url: "https://www.cfmoto.com.tr/satis-noktalari?sehir={il_slug}"
        iterate: il_slug
        il_url_den: true
      - rol: servis
        url: "https://www.cfmoto.com.tr/servis-noktalari?sehir={il_slug}"
        iterate: il_slug
        il_url_den: true
    row: "table tbody tr"
    fields:
      bayi_adi: "td:nth-child(1)"
      adres:    "td:nth-child(2)"
      ilce:     "td:nth-child(3)"
      telefon:  {sel: "td:nth-child(4) a", attr: "href", regex: "tel:(.+)"}
  "Kuba":
    # ajax.php'ye POST. Tarayıcı GEREKMİYOR.
    # · Sayfada <base href="/"> var: uç KÖKTE, /bayi-servis/ altında değil.
    # · İlçe seçiminde "Tüm İlçeler" = 0 → il başına tek istek, 973 ilçe yok.
    # · Uç markayı ayırmaz, tüm MJ grubunu döner (Skyjet, Benelli, Ape Ryder...);
    #   ayrım her kaydın "Yetkileri" satırında yazıyor → kayit_suzgeci.
    method: POST
    iterate: il_post
    headers:
      X-Requested-With: XMLHttpRequest
    row: "div.result-item"
    fields:
      bayi_adi: "div.location-name h5"
      adres: {sel: "div.text-item p", index: 0}
      telefon: {sel: "a[href^='tel:']", attr: "href", regex: 'tel:\s*([0-9 ()]+)'}
    ekstra_alanlar:
      yetkiler: {sel: "div.text-item div:nth-of-type(2) p"}
    kayit_suzgeci:
      alan: yetkiler
      icermeli: ["Kuba Motor"]
    beklenen: [600, 1400]
    kaynaklar:
      - rol: satis
        url: "https://www.kubamotor.com.tr/ajax.php"
        data: {action: states, city: "{il_adi}", state: "0", category: "Bayi"}
      - rol: servis
        url: "https://www.kubamotor.com.tr/ajax.php"
        data: {action: states, city: "{il_adi}", state: "0", category: "Servis"}

  "RKS":
    # ajax.php'ye POST. Tarayıcı GEREKMİYOR.
    # · Sayfada <base href="/"> var: uç KÖKTE, /bayi-servis/ altında değil.
    # · İlçe seçiminde "Tüm İlçeler" = 0 → il başına tek istek, 973 ilçe yok.
    # · Uç markayı ayırmaz, tüm MJ grubunu döner (Skyjet, Benelli, Ape Ryder...);
    #   ayrım her kaydın "Yetkileri" satırında yazıyor → kayit_suzgeci.
    method: POST
    iterate: il_post
    headers:
      X-Requested-With: XMLHttpRequest
    row: "div.result-item"
    fields:
      bayi_adi: "div.location-name h5"
      adres: {sel: "div.text-item p", index: 0}
      telefon: {sel: "a[href^='tel:']", attr: "href", regex: 'tel:\s*([0-9 ()]+)'}
    ekstra_alanlar:
      yetkiler: {sel: "div.text-item div:nth-of-type(2) p"}
    kayit_suzgeci:
      alan: yetkiler
      # "RKS Motor" tek başına yetmiyordu: sitede bazı noktalar yalnızca
      # "RKS E-Scooter Servisi" olarak geçiyor ve eleniyorlardı
      # (ör. Alanya / Özyiğit Motor - Ahmet Özyiğit). İkisi de RKS.
      icermeli: ["RKS Motor", "RKS E-Scooter", "RKS Elektrikli"]
    beklenen: [500, 1200]
    kaynaklar:
      - rol: satis
        url: "https://www.rksmotor.com.tr/ajax.php"
        data: {action: states, city: "{il_adi}", state: "0", category: "Bayi"}
      - rol: servis
        url: "https://www.rksmotor.com.tr/ajax.php"
        data: {action: states, city: "{il_adi}", state: "0", category: "Servis"}

  "Arora":
    # Sayfa yapısı 30.08.2026'da yakalanıp doğrulandı: 20 kayıt, hepsinde
    # il/ilçe/adres/telefon tam. İl seçimi URL'e yansımıyor, bu yüzden
    # sayfa gerçekten kullanılıyor (listeden seç → sonucu oku).
    mode: browser
    beklenen: [400, 900]
    # Türü kart taşımıyor; sayfadaki onay kutusuyla süzülüyor.
    # Her tür ayrı ayrı işaretlenip 81 il geziliyor.
    tur_suzgeci:
      secici: "input[name=yetkili-servis]"
      degerler:
        - {deger: "B",  rol: satis}
        - {deger: "S",  rol: servis}
        - {deger: "BS", rol: satis_servis}
    kaynaklar:
      - rol: satis_servis
        url: "https://www.arora.com.tr/hizmet-noktalari"
    row: "div.points-card-wrapper"
    fields:
      bayi_adi: "h3.points-card-title"
      adres:    "div.points-card-address"
      telefon:  {sel: "a.points-card-tel", attr: "href", regex: "tel:(.+)"}
    il_ilce_birlesik: konum
    ekstra_alanlar:
      konum: "div.points-card-city"
  "Yuki":
    mode: browser
    kaynaklar:
      - rol: satis
        url: "https://yukimotor.com.tr/satis-noktalari/"
      - rol: servis
        url: "https://yukimotor.com.tr/servis-noktalari/"

  # 11. VOGE  ·  Çin  ·  www.vogeturkiye.com.tr
  "Voge":
    mode: browser
    kaynaklar:
      - rol: satis_servis
        url: "https://www.vogeturkiye.com.tr/yetkili-satici/"

  # 12. PIAGGIO  ·  İtalya  ·  www.piaggio.com.tr
  "Piaggio":
    mode: browser
    beklenen: [42, 120]   # Vespa ile aynı distribütör, benzer ağ varsayıldı
    kaynaklar:
      - rol: satis
        url: "https://www.piaggio.com.tr/tr/yetkili-saticilar.html"
      - rol: servis
        url: "https://www.piaggio.com.tr/tr/yetkili-servisler.html"

  # 13. VESPA  ·  İtalya  ·  www.vespa.com.tr
  "Vespa":
    mode: browser
    beklenen: [42, 120]   # saha ~40 bayi ~60 servis · motorcular.com: 32 bayi 54 servis
    kaynaklar:
      - rol: satis
        url: "https://www.vespa.com.tr/tr/yetkili-saticilar.html"
      - rol: servis
        url: "https://www.vespa.com.tr/tr/yetkili-servisler.html"

  # 14. KYMCO  ·  Tayvan  ·  www.kymco.com.tr
  "Kymco":
    # Tarayıcı ve il seçimi GEREKMİYOR. Sayfa bütün ağı tek tırnaklı bir JS
    # nesnesi (GeoJSON) olarak kaynağa basıyor; harita onu okuyor. Tek GET
    # ile 75 kaydın hepsi geliyor, rol ayrımı da veride hazır.
    beklenen: [70, 90]    # site 2026-08 itibarıyla 37 satıcı + 38 servis
    kaynaklar:
      - rol: satis_servis
        url: "https://www.kymco.com.tr/tr/satis-servis-agi.html"
    gomulu:
      kayit: "\\{\\s*'type':\\s*'yetkili-[a-z]+',.*?'msx':\\s*'.*?'\\s*\\}\\s*\\}"
      fields:
        bayi_adi: name
        adres: address
        telefon: phone1
        email: mail1
      ekstra_alanlar:
        konum: city
      rol_alani:
        regex: "'type':\\s*'(yetkili-[a-z]+)'"
        esleme:
          yetkili-satici: satis
          yetkili-servis: servis
    il_ilce_birlesik: konum

  # 15. APRILIA  ·  İtalya-Çin  ·  www.aprilia.com.tr
  "Aprilia":
    mode: browser
    beklenen: [28, 78]   # Vespa/Piaggio'dan küçük ağ varsayıldı
    kaynaklar:
      - rol: satis
        url: "https://www.aprilia.com.tr/tr/yetkili-saticilar.html"
      - rol: servis
        url: "https://www.aprilia.com.tr/tr/yetkili-servisler.html"

  # 16. HERO  ·  Hindistan  ·  www.heromotor.com.tr
  "Hero":
    # TARANMIYOR. Site Cloudflare korumalı; GitHub Actions IP'lerinden
    # her PHP isteği 403 dönüyor (statik dosyalar 200 — ölçüldü).
    # Veri elle/hero.json'da; kullanıcının kendi tarayıcısında
    # hero-konsol3.js çalıştırılarak toplanıyor.
    elle: true
    etkilesim: il_secimi
    kaynaklar:
      - rol: satis
        url: "https://www.heromotor.com.tr/bayiler/"
      - rol: servis
        url: "https://www.heromotor.com.tr/servisler/"

