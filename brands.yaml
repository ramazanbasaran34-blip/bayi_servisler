# ============================================================================
#  BAYİ RADAR — 62 Motosiklet Markası · Satış ve Servis
#  Kaynak: markalar_ve_web_siteleri_bayiler_ve_servisler_linkleri_28_08_2026.xlsx
# ----------------------------------------------------------------------------
#  ROL MANTIĞI
#    Her markanın bir ya da iki kaynağı var:
#      satis_servis → bayi ve servis linki AYNI. Site ikisini birlikte veriyor,
#                     kayıtlar doğrudan "Satış + Servis" sayılıyor. (25 marka)
#      satis + servis → linkler AYRI, ikisi ayrı taranıyor. (37 marka)
#
#    Ayrı taranan markalarda aynı firma iki listede de çıkabilir. Sistem bunu
#    telefon, ad çekirdeği ve adres benzerliğiyle tanıyıp TEK kayda birleştirir
#    ve rolünü "Satış + Servis" yapar. (bayiradar/eslestir.py)
#
#  BEKLENEN SAYI
#    Bazı markalarda saha bilgisinden beklenen kayıt aralığı yazılı. Denetim
#    aracı gelen sayıyı bununla karşılaştırıyor. Amaç, "kayıtlar temiz görünüyor
#    ama listenin yarısı hiç gelmemiş" durumunu yakalamak — Mondial'de tam bu
#    oldu: 390 tertemiz kayıt vardı, 600 servisin hiçbiri yoktu.
#
#    Aralık kaynak yapısına göre hesaplandı. Bayi ve servis AYNI sayfadaysa
#    kayıtlar zaten birleşik geliyor, beklenen ~büyük olan sayı kadar. AYRI
#    sayfadaysa aynı firma iki listede çıkabilir; sistem birleştirse de sonuç
#    "büyük olan" ile "toplam" arasında bir yerde oluyor.
#
#  TARİF GEREKMİYOR
#    CSS seçici yazılı değil; yapı sayfadan otomatik çözülüyor.
#    Tutmazsa marka 'hatali' işaretlenir, eski verisi korunur.
# ============================================================================

