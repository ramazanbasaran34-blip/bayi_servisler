    # parametre denemek hep aynı sayfayı veriyordu. Sayfa gerçekten kullanılıyor.
    mode: browser
    etkilesim: il_secimi
    beklenen: [300, 900]
    kaynaklar:
      - rol: satis_servis
        url: "https://www.rksmotor.com.tr/bayi-servis/rksmotor.html"
  "Arora":
    # Sayfa yapısı 30.08.2026'da yakalanıp doğrulandı: 20 kayıt, hepsinde
    # il/ilçe/adres/telefon tam. İl seçimi URL'e yansımıyor, bu yüzden
    # sayfa gerçekten kullanılıyor (listeden seç → sonucu oku).
    mode: browser
    beklenen: [400, 900]
    # Türü kart taşımıyor; sayfadaki onay kutusuyla süzülüyor.
    # Her tür ayrı ayrı işaretlenip 81 il geziliyor.
    tur_suzgeci:
      secici: "input[name=yetkili-servis]"
      degerler:
        - {deger: "B",  rol: satis}
        - {deger: "S",  rol: servis}
        - {deger: "BS", rol: satis_servis}
    kaynaklar:
      - rol: satis_servis
        url: "https://www.arora.com.tr/hizmet-noktalari"
    row: "div.points-card-wrapper"
    fields:
      bayi_adi: "h3.points-card-title"
      adres:    "div.points-card-address"
      telefon:  {sel: "a.points-card-tel", attr: "href", regex: "tel:(.+)"}
    il_ilce_birlesik: konum
    ekstra_alanlar:
      konum: "div.points-card-city"
  "Yuki":
    mode: browser
    kaynaklar:
      - rol: satis
        url: "https://yukimotor.com.tr/satis-noktalari/"
      - rol: servis
        url: "https://yukimotor.com.tr/servis-noktalari/"

